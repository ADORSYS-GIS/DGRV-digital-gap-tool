    <!-- Unregister stale service workers from old deploys before anything else loads. -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          var active = registrations.filter(function(r) { return r.active; });
          var waiting = registrations.filter(function(r) { return r.waiting && !r.active; });
          waiting.forEach(function(r) { r.unregister(); });
          if (active.length > 1) {
            active.slice(0, active.length - 1).forEach(function(r) { r.unregister(); });
          }
        });
      }
    </script>

    <!-- Primary meta -->
    <meta name="description" content="DGAT helps cooperatives in Southern Africa assess and close their digital gaps through structured assessments, actionable recommendations, and progress tracking." />
    <meta name="author" content="DGRV" />
