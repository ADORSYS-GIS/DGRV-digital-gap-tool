    <title>DGAT GAP ANALYSIS</title>

    <!-- Unregister stale service workers from old deploys before anything else loads.
         Without this, old SWs block the new one from installing and offline breaks. -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          // Keep only the most recently installed SW, unregister the rest
          var active = registrations.filter(function(r) { return r.active; });
          var waiting = registrations.filter(function(r) { return r.waiting && !r.active; });
          // Unregister all purely-waiting (stuck) registrations
          waiting.forEach(function(r) { r.unregister(); });
          // If more than one active, unregister all but the newest
          if (active.length > 1) {
            active.slice(0, active.length - 1).forEach(function(r) { r.unregister(); });
          }
        });
      }
    </script>

      name="description"
      content="Empower your cooperative with DGAT GAP ANALYSISs. Built for cooperatives in Southern Africa."
    />
