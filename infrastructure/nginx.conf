# Define upstream servers
upstream keycloak_server {
    server keycloak:8080;
}

upstream backend_server {
    server backend:3001;
}

# HTTP only — SSL is terminated by host Nginx
server {
    listen 80;
    server_name app.decidel.app;
    root /usr/share/nginx/html;
    index index.html;

    # Health check endpoint
    location /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'OK';
    }

    # Add headers
    add_header Access-Control-Allow-Origin '*' always;

    # Service worker must be served with correct headers so it can control the full origin
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        try_files $uri =404;
    }

    # Workbox runtime chunks — no-cache so updates are picked up immediately
    location ~* /workbox-.*\.js$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # PWA manifest
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Handle client-side routing — always fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Specifically handle the callback route to prevent Keycloak redirect loops
    location /callback {
        try_files $uri $uri/ /index.html;
    }

    # Proxy requests to Keycloak
    # Proxy requests to Keycloak
    location /keycloak/ {
        proxy_pass http://keycloak_server/keycloak/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Prefix /keycloak;
        # Skip SSL verification
        proxy_ssl_verify off;

        # Handle redirects properly
        proxy_redirect http://keycloak_server/keycloak/ https://$host/keycloak/;
        proxy_redirect http://keycloak:8080/keycloak/ https://$host/keycloak/;
    }

    # Proxy requests to Backend API
    location /api/ {
        proxy_pass http://backend_server/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}